name: Research CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - run: python -m unittest discover -s tests -v
  qiskit-aer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - run: python -m pip install -r requirements-simulator.lock.txt
      - run: python -m pip check
      - run: python -m scripts.check_environment requirements-simulator.lock.txt --output environment.json
      - run: python -c "import qiskit, qiskit_aer, qiskit_ibm_runtime; print(qiskit.__version__, qiskit_aer.__version__, qiskit_ibm_runtime.__version__)"
      - run: python -m pip freeze > environment.txt
      - run: python -m scripts.strict_suite
      - run: python -m benchmarks.resources resources.json
      - run: python -m benchmarks.matched
      - run: python -m benchmarks.aer_recovery
      - run: python -m benchmarks.known_support
      - run: python -m benchmarks.snapshot
      - run: python -m benchmarks.snapshot_audited
      - run: python -m benchmarks.independent --output evidence/independent/results.json --reverse-check
      - run: python -m benchmarks.hypotheses
      - run: python -m scripts.evidence_manifest --output evidence-manifest.json hypotheses-results.json resources.json environment.txt environment.json matched-results.json aer-recovery.json known-support.json snapshot-results.json snapshot-audited-results.json evidence/independent/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simulator-resources
          path: |
            hypotheses-results.json
            resources.json
            environment.txt
            environment.json
            evidence-manifest.json
            matched-results.json
            aer-recovery.json
            known-support.json
            snapshot-results.json
            snapshot-audited-results.json
            evidence/independent/results.json
