name: Oracle boundary controls
on:
  pull_request:
    paths: ['qcdt/**','benchmarks/oracle_boundaries.py','tests/test_oracle_contract.py','requirements-qiskit.txt','.github/workflows/oracle-control.yml']
  push:
    branches: [main]
    paths: ['qcdt/**','benchmarks/oracle_boundaries.py','tests/test_oracle_contract.py','requirements-qiskit.txt','.github/workflows/oracle-control.yml']
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.18'
      - run: python -m pip install -r requirements-qiskit.txt
      - run: python -m unittest discover -s tests -p test_oracle_contract.py -v
      - run: python -m benchmarks.oracle_boundaries
      - run: python -m pip freeze > oracle-environment.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oracle-boundary-evidence
          path: |
            oracle-boundary-results.json
            oracle-environment.txt
